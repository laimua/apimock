name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 同一 PR 新 push 时取消旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 测试用加密密钥（仅 CI，不要复用到生产）
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
      SKIP_SEED: 'true'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version 不传：读 package.json 的 packageManager 字段（单一真相源）

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (src)
        run: pnpm typecheck

      - name: Typecheck (tests)
        run: pnpm typecheck:tests

      - name: Lint
        run: pnpm lint

      - name: Run unit + integration tests
        run: pnpm test --reporter=default

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next/
            !.next/cache
          retention-days: 3

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    env:
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
      SKIP_SEED: 'false'
      NODE_ENV: test
      DB_TYPE: sqlite
      SQLITE_PATH: ./data/apimock-ci.db
      # G1 鉴权:E2E 需登录才能访问管理面。globalSetup 用此 token 登录种 cookie
      MANAGE_TOKEN: ci-e2e-manage-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Ensure data dir exists
        run: mkdir -p ./data

      - name: Ensure e2e auth dir exists (G1 storageState)
        run: mkdir -p ./e2e/.auth

      - name: Sync DB schema (drizzle-kit push，CI 一次性环境比 migrate 更稳)
        run: pnpm db:push

      - name: Build
        run: pnpm build

      - name: Run E2E
        # retries=0 调试模式：失败立即暴露真实断言，不被 retry 掩盖
        run: pnpm exec playwright test --project=chromium --retries=0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
