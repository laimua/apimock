name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# 同一 PR 新 push 时取消旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 测试用加密密钥（仅 CI，不要复用到生产）
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
      SKIP_SEED: 'true'
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version 不传：读 package.json 的 packageManager 字段（单一真相源）

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (src)
        run: pnpm typecheck

      - name: Typecheck (tests)
        run: pnpm typecheck:tests

      - name: Lint
        run: pnpm lint

      - name: Run unit + integration tests
        run: pnpm test --reporter=default

      - name: SQLite schema parity gate (drizzle push vs migrate-standalone)
        run: pnpm db:check-parity

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next/
            !.next/cache
          retention-days: 3

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    env:
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
      SKIP_SEED: 'false'
      NODE_ENV: test
      DB_TYPE: sqlite
      SQLITE_PATH: ./data/apimock-ci.db
      # G1 鉴权:E2E 需登录才能访问管理面。globalSetup 用此 token 登录种 cookie
      MANAGE_TOKEN: ci-e2e-manage-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Ensure data dir exists
        run: mkdir -p ./data

      - name: Ensure e2e auth dir exists (G1 storageState)
        run: mkdir -p ./e2e/.auth

      - name: Sync DB schema (drizzle-kit push，CI 一次性环境比 migrate 更稳)
        run: pnpm db:push

      - name: Build
        run: pnpm build

      - name: Run E2E
        # retries=0 调试模式：失败立即暴露真实断言，不被 retry 掩盖
        run: pnpm exec playwright test --project=chromium --retries=0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # MySQL 栈独立门禁(不动上面 sqlite 门禁):
  # push + build + @db-core 核心 E2E(project/endpoint/response CRUD、mock hit、导入、
  # 鉴权——鉴权由 global-setup 登录链路覆盖)。全量 vitest 不进首版(mock 掉 db 的
  # 单测无价值,连库稳定性未证);本地 MySQL 全量 vitest 连跑三次无污染后再升 required。
  # job 时长与核心集合大小挂钩,新增 @db-core 用例需评估时长。
  mysql:
    name: MySQL (push + build + core E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apimock
          # 允许容器外(GitHub runner 网络命名空间)以 TCP 连入
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
      SKIP_SEED: 'false'
      NODE_ENV: test
      # 显式 TCP 连 127.0.0.1,不用 localhost(防 socket 语义歧义)
      DB_TYPE: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: apimock
      MANAGE_TOKEN: ci-e2e-manage-token
      # 注意:此处刻意不设 SQLITE_PATH —— 防静默回退到 sqlite(下方有守卫步骤)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard (no SQLite fallback allowed)
        run: |
          echo "DB_TYPE=$DB_TYPE"
          if [ -n "$SQLITE_PATH" ]; then
            echo "::error::SQLITE_PATH must NOT be set in mysql job (silent sqlite fallback)"
            exit 1
          fi

      - name: Verify MySQL charset utf8mb4
        run: |
          cid=$(docker ps -q -f name=mysql)
          docker exec "$cid" mysql -uroot -proot -e "SHOW VARIABLES LIKE 'character_set_server'; SHOW VARIABLES LIKE 'collation_server';" | tee /tmp/charset.log
          grep -q utf8mb4 /tmp/charset.log || { echo "::error::server charset is not utf8mb4"; exit 1; }

      - name: Push schema to empty MySQL (drizzle-kit push)
        run: pnpm db:push --force

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Ensure data/auth dirs
        run: |
          mkdir -p ./data
          mkdir -p ./e2e/.auth

      - name: Build
        run: pnpm build

      - name: Run core E2E (@db-core only)
        run: pnpm exec playwright test --project=chromium --retries=0 --grep @db-core

      - name: Verify no SQLite fallback happened (tables-in-db detector)
        if: always()
        run: |
          # 说明:db.ts 静态 import db-sqlite,模块加载即会创建空的 ./data/apimock.db
          # (不查询)。因此"存在 .db 文件"不是回退信号;"里面有表"才是——
          # push 只打 MySQL,任何 sqlite 库出现表都说明真实发生了回退写入。
          node -e "
          const fs=require('fs'),path=require('path');
          const Database=require('better-sqlite3');
          let bad=false;
          (function walk(d){
            for(const e of fs.readdirSync(d,{withFileTypes:true})){
              if(e.name==='node_modules'||e.name.startsWith('.git'))continue;
              const p=path.join(d,e.name);
              if(e.isDirectory())walk(p);
              else if(e.name.endsWith('.db')){
                const db=new Database(p,{readonly:true});
                const n=db.prepare(\"SELECT count(*) c FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'\").get().c;
                db.close();
                console.log(p,'tables='+n);
                if(n>0)bad=true;
              }
            }
          })('.');
          process.exit(bad?1:0);
          " || { echo '::error::SQLite db with tables found — silent fallback happened'; exit 1; }
          echo 'OK: no sqlite tables, mysql-only confirmed'

      - name: Upload Playwright report (mysql)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mysql
          path: playwright-report/
          retention-days: 7
